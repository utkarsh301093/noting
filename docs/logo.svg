<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Folio logo: an original mark — a ruled page with a folded corner and a gold pen stroke. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2927"/>
      <stop offset="1" stop-color="#171615"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f3c887"/>
      <stop offset="1" stop-color="#b68235"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <g transform="rotate(-6 512 512)">
    <path d="M300 190 H650 L746 286 V826 H300 Z" fill="#f8f4f0"/>
    <path d="M650 190 V286 H746 Z" fill="#d9d0c4"/>
    <g stroke="#d8d0c6" stroke-width="10" stroke-linecap="round">
      <line x1="360" y1="400" x2="686" y2="400"/>
      <line x1="360" y1="478" x2="686" y2="478"/>
      <line x1="360" y1="556" x2="610" y2="556"/>
    </g>
  </g>
  <path d="M236 768 C 340 650, 420 830, 512 712 S 680 610, 800 700"
        fill="none" stroke="url(#gold)" stroke-width="46" stroke-linecap="round"/>
  <circle cx="800" cy="700" r="10" fill="#f3c887"/>
</svg>
